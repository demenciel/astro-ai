# Deploys to Cloudflare Workers on every push to main.
# Needs repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (`npm run setup -- --only=github`).
# Worker secrets (Stripe, AI keys, admin password) live in Cloudflare and survive deploys.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret not set; skipping deploy. Run: npm run setup -- --only=github"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif grep -q '00000000-0000-0000-0000-000000000000' wrangler.jsonc; then
            echo "::notice::D1 not provisioned yet (placeholder database_id); skipping deploy. Run: npm run setup"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.cfg.outputs.ready == 'true'
        run: npm run build

      - name: Apply D1 migrations
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        if: steps.cfg.outputs.ready == 'true'
        run: npx wrangler deploy
